title = "Enterprise Agent OS gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''backend/tests/.*\.json$''',
  '''backend/tests/fixtures/.*$''',
  '''docs?/.*\.md$''',
]
description = "Allow fixture data and example env values"

[[rules]]
id = "eos-mock-tokens"
description = "Allow mock tokens used in dev"
regex = '''EOS_(MOCK_TOKEN|ALLOW_DEMO_TOKEN|DEV_SECRET)=.*'''
keywords = ["EOS_MOCK_TOKEN", "EOS_ALLOW_DEMO_TOKEN", "EOS_DEV_SECRET"]
allowlist = true

[[rules]]
id = "generic-api-key"
description = "Generic high-entropy API keys"
regex = '''(?i)(?:api[_-]?key|apikey|secret)[_-]?(?:=|:)\s*['"]([a-z0-9_\-]{20,})['"]'''
keywords = ["api_key", "apikey", "secret"]

[[rules]]
id = "openai-key"
description = "OpenAI-style keys (sk-...)"
regex = '''sk-[A-Za-z0-9]{32,}'''
keywords = ["sk-"]