[importlinter]
# importlinter needs every top-level package declared as a root so its
# internal graph walker sees the whole workspace. The workspace has 11
# independently installable top-level packages.
root_packages =
    eos_kernel
    eos_schema
    eos_persistence
    eos_observability
    eos_auth
    eos_messaging
    eos_http
    eos_llm
    eos_sandbox
    eos_vector
    eos_vault
    deos

# `fastapi`, `sqlalchemy`, etc. live outside our workspace roots; tell
# importlinter it's allowed to consider them in the graph.
include_external_packages = True

# ── Week 1 contracts ────────────────────────────────────────────────────────
# Only `identity` is implemented in Week 1. Other modules (tool, skill,
# memory, governance, …) come online in later weeks. Each contract below
# only references modules that exist today; expand them as modules land.

[importlinter:contract:no-business-in-libs]
type = forbidden
name = Libs must not depend on modules or composition
source_modules =
    eos_kernel
    eos_auth
    eos_observability
    eos_persistence
    eos_messaging
    eos_http
    eos_schema
    eos_llm
    eos_sandbox
    eos_vector
    eos_vault
forbidden_modules =
    deos.modules.identity
    deos.composition

[importlinter:contract:domain-purity]
# Each module's domain layer must NOT import any framework/infrastructure.
type = forbidden
name = Domain layer stays framework-free
source_modules =
    deos.modules.identity.domain
forbidden_modules =
    fastapi
    sqlalchemy
    asyncpg
    redis
    httpx
    pydantic
    eos_auth
    eos_observability
    eos_persistence
    eos_messaging
    eos_http
    eos_llm
    eos_sandbox
    eos_vector

[importlinter:contract:composition-imports-use-cases-only-via-services]
# The composition root is the only place that wires concrete adapters together.
# It may import `application.services` and `adapter.*`, but never a specific
# use_case file directly — use cases are exposed via their service container.
type = forbidden
name = Composition accesses use cases via services
source_modules = deos.composition
forbidden_modules =
    deos.modules.identity.application.use_cases

