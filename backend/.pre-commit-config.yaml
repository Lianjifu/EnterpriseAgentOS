# See https://pre-commit.com for more information.
# Run `pre-commit run --all-files` from backend/ to check,
# `pre-commit install` (run from backend/) to enable hooks.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: [pydantic>=2.9]

  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (architecture contract)
        entry: uv run lint-imports --config .importlinter.ini
        language: system
        files: \.py$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitlint
        name: commitlint (conventional commits)
        entry: npx --no-install commitlint --edit
        language: system
        pass_filenames: false
        stages: [commit-msg]
        additional_dependencies: []

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]