[project]
name = "eos-app"
version = "0.1.0"
description = "Composition root for Enterprise Agent OS"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-observability",
    "eos-auth",
    "eos-messaging",
    "eos-llm",
    "eos-sandbox",
    "eos-vector",
    "eos-http",
    "eos-vault",
    "deos-identity",
    "deos-agent-runtime",
    "deos-tool",
    "deos-skill",
    "deos-memory",
    "deos-governance",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]