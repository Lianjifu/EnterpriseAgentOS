[project]
name = "eos-auth"
version = "0.1.0"
description = "JWT issue/verify, API-key guard, FastAPI auth middleware"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_auth"]

[tool.ruff]
src = ["src"]