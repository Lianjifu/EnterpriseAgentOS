[project]
name = "eos-http"
version = "0.1.0"
description = "HTTP middleware chain + error envelope + health/rate-limit/CORS"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-observability",
    "eos-auth",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_http"]

[tool.ruff]
src = ["src"]