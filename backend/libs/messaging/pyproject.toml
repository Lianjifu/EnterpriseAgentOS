[project]
name = "eos-messaging"
version = "0.1.0"
description = "In-process and Redis-stream event bus with typed envelopes"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "aiokafka>=0.12.0",
    "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_messaging"]

[tool.ruff]
src = ["src"]