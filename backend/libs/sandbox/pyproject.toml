[project]
name = "eos-sandbox"
version = "0.1.0"
description = "Local + Docker sandbox abstraction + RunToken HMAC"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "pydantic>=2.9",
    "aiodocker>=0.21,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_sandbox"]

[tool.ruff]
src = ["src"]