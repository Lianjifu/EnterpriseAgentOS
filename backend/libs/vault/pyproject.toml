[project]
name = "eos-vault"
version = "0.1.0"
description = "Secrets resolution — env/file backed placeholders for P5; real Vault in P10"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "eos-kernel",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_vault"]

[tool.ruff]
src = ["src"]
