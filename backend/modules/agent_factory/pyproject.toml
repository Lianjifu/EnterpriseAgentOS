[project]
name = "deos-agent-factory"
version = "0.1.0"
description = "Agent factory module — AgentTemplate / AgentVersion / Release; P8 of doc 12."
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-messaging",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]