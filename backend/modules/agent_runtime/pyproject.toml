[project]
name = "deos-agent-runtime"
version = "0.1.0"
description = "Agent runtime module: sessions, turns, LLM streaming, SSE"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-auth",
    "eos-messaging",
    "eos-llm",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]