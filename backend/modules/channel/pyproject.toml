[project]
name = "deos-channel"
version = "0.1.0"
description = "Inbound/outbound channel adapters (Feishu, DingTalk, WeChat Work, Web) + webhook verification"
requires-python = ">=3.12"
dependencies = [
  "eos-kernel",
  "eos-schema",
  "eos-persistence",
  "eos-auth",
  "eos-messaging",
  "eos-vault",
  "eos-http",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.pytest.ini_options]
pythonpath = [
  "src/deos",
  "tests/unit",
]
testpaths = ["tests/unit"]