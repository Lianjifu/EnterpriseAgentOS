[project]
name = "deos-evaluation"
version = "0.1.0"
description = "Evaluation module — datasets, cases, runs and the gate the agent_factory Release endpoint calls into."
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-messaging",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]