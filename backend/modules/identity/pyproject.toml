[project]
name = "deos-identity"
version = "0.1.0"
description = "Identity module: tenants, workspaces, users, API keys"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-auth",
    "eos-messaging",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]