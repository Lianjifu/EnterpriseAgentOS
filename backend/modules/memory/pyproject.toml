[project]
name = "deos-memory"
version = "0.1.0"
description = "Memory module — vector-backed recall with pgvector; P4 of doc 12."
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-vector",
    "eos-messaging",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]
