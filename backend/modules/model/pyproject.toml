[project]
name = "deos-model"
version = "0.1.0"
description = "Model module: per-tenant model registry + routing + quotas + AES-GCM credential storage (P6)"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-auth",
    "eos-messaging",
    "eos-llm",
    "eos-vault",
    "eos-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]