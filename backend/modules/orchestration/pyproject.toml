[project]
name = "deos-orchestration"
version = "0.1.0"
description = "Orchestration module — multi-agent Plan DSL + executor; P7 of doc 12."
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-messaging",
    "eos-pack-signing",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]
