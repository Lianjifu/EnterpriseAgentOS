[project]
name = "deos-skill"
version = "0.1.0"
description = "Skill module: package CRUD, install with RunToken, sandbox invocation lifecycle"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-auth",
    "eos-messaging",
    "eos-http",
    "eos-sandbox",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]
