[project]
name = "deos-tool"
version = "0.1.0"
description = "Tool module: registration, CRUD, MCP / OpenAPI / custom invocation, batch"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-persistence",
    "eos-auth",
    "eos-messaging",
    "eos-http",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]
