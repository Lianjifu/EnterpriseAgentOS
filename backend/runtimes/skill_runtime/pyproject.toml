[project]
name = "eos-skill-runtime"
version = "0.1.0"
description = "Skill sandbox runtime sidecar (P3 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "eos-kernel",
    "eos-schema",
    "eos-sandbox",
    "fastapi>=0.115.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.ruff]
src = ["src"]