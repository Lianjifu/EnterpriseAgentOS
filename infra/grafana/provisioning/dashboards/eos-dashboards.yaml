# Grafana provisioning — dashboard provider.
#
# Tells Grafana to auto-load dashboards from
# ``/etc/grafana/dashboards/`` on boot.  Pairs with the static
# ``eos-overview.json`` + ``eos-costs.json`` committed in this
# directory.

apiVersion: 1

providers:
  - name: EnterpriseAgentOS
    orgId: 1
    folder: EnterpriseAgentOS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
