# Grafana provisioning — Prometheus datasource.
#
# Drop into /etc/grafana/provisioning/datasources/ (or mount via
# docker-compose) so Grafana auto-creates the Prometheus datasource
# on first boot.  No manual UI clicks required.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.55.0
