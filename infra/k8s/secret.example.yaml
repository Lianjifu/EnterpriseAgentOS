# Secret template — NEVER commit real values.
# Replace `placeholder` with vault-injected references, e.g.:
#   stringData:
#     EOS_DATABASE_URL: vault:secret/prod/eos#database_url
# Actual values come from External Secrets Operator (ESO) or sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: eos-app-secret
  namespace: eos-prod
  annotations:
    # tells ESO which Vault path to fetch from
    # unseal.io/cluster: vault
    # vault.unsealer.io/vault-addr: https://vault.internal:8200
    description: |
      Template only. In production, real values are injected by
      External Secrets Operator from vault://prod/eos/* paths.
      See deploy/env.prod.example for the complete list.
type: Opaque
stringData:
  EOS_DATABASE_URL: "postgresql+asyncpg://eos:PLACEHOLDER_PG_PASS@postgres:5432/eos"
  EOS_REDIS_URL: "redis://redis:6379/0"
  EOS_JWT_SECRET: "PLACEHOLDER_JWT_SECRET"
  EOS_RUN_TOKEN_SECRET: "PLACEHOLDER_RUN_TOKEN_SECRET"
  EOS_MODEL_MASTER_KEY: "PLACEHOLDER_MODEL_MASTER_KEY_HEX"
  EOS_OBJECT_STORAGE_URL: "https://s3.internal.example.com"
  EOS_OBJECT_STORAGE_BUCKET: "eos-artifacts-prod"
  EOS_OTLP_ENDPOINT: "https://otel.internal.example.com:4317"
  EOS_SENTRY_DSN: "https://PLACEHOLDER@sentry.internal/1"
