apiVersion: v1
kind: Service
metadata:
  name: eos-app-stable
  namespace: eos-prod
  labels:
    app: eos
    ring: stable
spec:
  type: ClusterIP
  selector:
    app: eos
    ring: stable
  ports:
    - name: http
      port: 80
      targetPort: 8102
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: eos-app-canary
  namespace: eos-prod
  labels:
    app: eos
    ring: canary
spec:
  type: ClusterIP
  selector:
    app: eos
    ring: canary
  ports:
    - name: http
      port: 80
      targetPort: 8102
      protocol: TCP
---
# Headless service for canary HPA metrics (optional)
apiVersion: v1
kind: Service
metadata:
  name: eos-app-metrics
  namespace: eos-prod
  labels:
    app: eos
spec:
  type: ClusterIP
  selector:
    app: eos
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
      protocol: TCP
