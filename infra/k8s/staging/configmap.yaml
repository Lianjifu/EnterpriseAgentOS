apiVersion: v1
kind: ConfigMap
metadata:
  name: eos-app-config
  namespace: eos-staging
  labels:
    name: eos-staging
    purpose: enterprise-agent-os
    environment: staging
data:
  EOS_ENV: "staging"
  EOS_LOG_LEVEL: "INFO"
  EOS_BAN_MOCK_TOKEN: "1"
  EOS_ALLOW_DEMO_TOKEN: "0"
  EOS_VAULT_MODE: "csi"
  EOS_GUNICORN_WORKERS: "2"
  EOS_GUNICORN_THREADS: "2"
  EOS_GUNICORN_TIMEOUT: "60"
  EOS_AUDIT_MODE: "kafka"
  EOS_AUDIT_CONSUMER_ENABLED: "false"
  EOS_EVENT_BUS: "inprocess"
  # Pricing & SLO defaults (overridable per-tenant via TenantSetting)
  EOS_CURRENCY: "USD"
  EOS_EVAL_SCORE_MIN: "0.7"
  EOS_EVAL_RECALL_MIN: "0.7"
  EOS_DEFAULT_TENANT_PLAN: "free"