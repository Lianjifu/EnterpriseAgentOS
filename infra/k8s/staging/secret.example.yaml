# Secret template for staging — NEVER commit real values.
# All nine ``EOS_*_REF`` env vars in deploy/env.prod.example resolve through
# the HashiCorp Vault CSI driver, which mounts each entry under
# ``/vault/secrets/<KEY>``.  The Python resolver reads those files as
# ``csi:<KEY>`` refs (see composition/eos_app/.../ref_resolver.py).
#
# Workflow (staging):
#   cp infra/k8s/staging/secret.example.yaml infra/k8s/staging/secret.yaml
#   $EDITOR secret.yaml        # fill vaultAddress, roleName, objects[].secretPath
#   kubectl apply -f infra/k8s/staging/secret.yaml -n eos-staging
#
# secret.yaml is in .gitignore (gitleaks G5 also catches accidental commits).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eos-app-csi
  namespace: eos-staging
spec:
  provider: vault
  parameters:
    # HashiCorp Vault CSI driver contract —
    # https://developer.hashicorp.com/vault/docs/platform/k8s/csi
    vaultAddress: "https://PLACEHOLDER_VAULT_HOST:8200"
    roleName: "PLACEHOLDER_VAULT_ROLE"
    objects: |
      - objectName: "EOS_DATABASE_URL"
        secretPath: "secret/data/staging/eos/database_url"
        secretKey: "value"
      - objectName: "EOS_REDIS_URL"
        secretPath: "secret/data/staging/eos/redis_url"
        secretKey: "value"
      - objectName: "EOS_JWT_SECRET"
        secretPath: "secret/data/staging/eos/jwt_secret"
        secretKey: "value"
      - objectName: "EOS_MODEL_MASTER_KEY"
        secretPath: "secret/data/staging/eos/model_master_key"
        secretKey: "value"
      - objectName: "EOS_RUN_TOKEN_SECRET"
        secretPath: "secret/data/staging/eos/run_token_secret"
        secretKey: "value"
      - objectName: "EOS_OPENAI_API_KEY"
        secretPath: "secret/data/staging/eos/openai_key"
        secretKey: "value"
      - objectName: "EOS_OBJECT_STORAGE_URL"
        secretPath: "secret/data/staging/eos/s3_url"
        secretKey: "value"
      - objectName: "EOS_OTLP_ENDPOINT"
        secretPath: "secret/data/staging/eos/otlp_endpoint"
        secretKey: "value"
      - objectName: "EOS_SENTRY_DSN"
        secretPath: "secret/data/staging/eos/sentry_dsn"
        secretKey: "value"
  # CSI driver injects the mounted files as k8s Secret data so the pod's
  # envFrom can pull them in by key.  Sync interval below matches the
  # staging cluster's SecretProviderClass refresh window (5 min).
  secretObjects:
    - secretName: eos-app-csi-synced
      type: Opaque
      data:
        - objectName: "EOS_DATABASE_URL"
          key: EOS_DATABASE_URL
        - objectName: "EOS_REDIS_URL"
          key: EOS_REDIS_URL
        - objectName: "EOS_JWT_SECRET"
          key: EOS_JWT_SECRET
        - objectName: "EOS_MODEL_MASTER_KEY"
          key: EOS_MODEL_MASTER_KEY
        - objectName: "EOS_RUN_TOKEN_SECRET"
          key: EOS_RUN_TOKEN_SECRET
        - objectName: "EOS_OPENAI_API_KEY"
          key: EOS_OPENAI_API_KEY
        - objectName: "EOS_OBJECT_STORAGE_URL"
          key: EOS_OBJECT_STORAGE_URL
        - objectName: "EOS_OTLP_ENDPOINT"
          key: EOS_OTLP_ENDPOINT
        - objectName: "EOS_SENTRY_DSN"
          key: EOS_SENTRY_DSN