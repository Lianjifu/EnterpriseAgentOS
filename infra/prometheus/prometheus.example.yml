# Example Prometheus configuration for EnterpriseAgentOS.
#
# Drop this into /etc/prometheus/prometheus.yml (or mount via
# docker-compose) so Prometheus scrapes the app and loads EOS
# rules.  This file is documentation; production deploys MUST
# review and customize before use.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: eos-dev

# Alertmanager wiring (out of scope for P9-6; placeholder).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # ── EOS backend HTTP /metrics endpoint ────────────────────────────────
  # The ``/metrics`` endpoint is exposed by the FastAPI app once
  # the prometheus_client instrumentation middleware is registered
  # (planned for P10+; P9-6 only provisions the rules + dashboards
  # so the panels become live once middleware lands).
  - job_name: eos-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - eos-app:8102
        labels:
          service: eos-backend
          env: development

  # ── Prometheus self ──────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
